<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>

            <div class="container text-center" style="max-width: 800px;">
            <h2>A:Định nghĩa các Class Buttons</h2>
                    <div class="d-flex flex-nowrap justify-content-center align-items-center gap-2 overflow-auto py-2">
                        <button type="button" class="btn btn-secondary">Default button</button>
                        <button type="button" class="btn btn-primary">Primary button</button>
                        <button type="button" class="btn btn-success">Success button</button>
                        <button type="button" class="btn btn-info">Info button</button>
                        <button type="button" class="btn btn-warning">Warning button</button>
                        <button type="button" class="btn btn-danger">Danger button</button>
                        <button type="button" class="btn btn-link">Link button</button>
                    </div>
            </div>



            <div class="container text-center" style="max-width: 800px;">
            <h2>B:Định nghĩa các Class Buttons Đường viền</h2>
                    <div class="d-flex flex-nowrap justify-content-center align-items-center gap-2 overflow-auto py-2">
                        <button type="button" class="btn btn-outline-primary">Primary (chính)</button>
                        <button type="button" class="btn btn-outline-secondary">Secondary (phụ)</button>
                        <button type="button" class="btn btn-outline-success">Success (thành công)</button>
                        <button type="button" class="btn btn-outline-danger">Danger (nguy hiểm)</button>
                        <button type="button" class="btn btn-outline-warning">Warning (cảnh báo)</button>
                        <button type="button" class="btn btn-outline-info">Info (thông tin)</button>
                        <button type="button" class="btn btn-outline-light">Light (sáng)</button>
                        <button type="button" class="btn btn-outline-dark">Dark (tối)</button>
                    </div>
            </div>

            <div class="container text-center" style="max-width: 800px;">
            <h2>C:Định nghĩa các Class Buttons Kích thước</h2>
                    <div class="d-flex flex-nowrap justify-content-center align-items-center gap-2 overflow-auto py-2">
                        <button type="button"
                        class="btn btn-primary btn-lg"
                        >
                        Large button</button>
                        <button type="button"
                            class="btn btn-primary"
                        >
                            Button
                        </button>
                        
                        <button type="button"
                        class="btn btn-primary btn-sm"
                        >
                        Small button</button>
                    </div>
            </div>

            <div class="container text-center" style="max-width: 800px;">
            <h2>D:Thành Phần Button</h2>
                    <div class="d-flex flex-nowrap justify-content-center align-items-center gap-2 overflow-auto py-2">
                        <a
                            name=""
                            id=""
                            class="btn btn-success"
                            href="#"
                            role="button"
                            >link button</a
                        >
                        <button
                            type="button"
                            class="btn btn-success"
                        >
                            Button chứa link
                        </button>
                        <button
                            type="button"
                            class="btn btn-success"
                            value="Button chứa value"
                        >
                        input button
                        </button>
                        <button
                            type="button"
                            class="btn btn-primary"
                            value="submit button"
                        >
                        submit button
                        </button>
                    </div>
                
            <div class="container text-center" style="max-width: 800px;">
            <h5>E: Trạng thái của nút</h5>
                <div class="d-flex flex-nowrap justify-content-center align-items-center gap-2 overflow-auto py-2">
                    <button type="button" class="btn btn-secondary text-nowrap">Nút bình thường</button>
                    <button type="button" class="btn btn-secondary active text-nowrap">Nút có thể click</button>
                    <button type="button" class="btn btn-secondary text-nowrap" disabled>Nút không thể click</button>
                    <a href="#" class="btn btn-secondary disabled text-nowrap" tabindex="-1" role="button">Link không thể click</a>
                </div>
            </div>

            <div class="container text-center" style="max-width: 800px;">
            <h5>F Nút Đang loading</h5>
                <div class="d-flex flex-nowrap justify-content-center align-items-center gap-2 overflow-auto py-2">
                    <button type="button" class="btn btn-primary">
                        <span class="spinner-border" role="status" aria-hidden="true"
                        ></span>
                    </button>
                    <button class="btn btn-primary">
                    <span class="spinner-border" role="status" aria-hidden="true"></span>Loading...
                    </button>
                    <button class="btn btn-primary">
                        <span class="spinner-border spinner-border-sm"></span>
                        loading...
                    </button>
                    <button class="btn btn-primary" disabled>
                        <span class="spinner-grow spinner-grow-sm"></span>
                        loading...
                    </button>
                </div>

        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
