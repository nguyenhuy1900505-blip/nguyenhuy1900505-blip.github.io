    <!doctype html>
    <html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 4.5: Navbar Responsive</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
        />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>

    <body>
        <header>
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
            <!-- Logo -->
            <a class="navbar-brand fw-bold" href="#">MyLogo</a>
            

            <!-- Nút thu gọn -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarBai45">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Nội dung Navbar -->
            <div class="collapse navbar-collapse" id="navbarBai45">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" href="#"><i class="bi bi-house-door me-1"></i> Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#"><i class="bi bi-person me-1"></i> Profile</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                    <i class="bi bi-envelope me-1"></i> Messages
                    </a>
                    <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Inbox</a></li>
                    <li><a class="dropdown-item" href="#">Sent</a></li>
                    </ul>
                </li>
                </ul>

                <!-- Form tìm kiếm + Login -->
                <form class="d-flex me-3">
                <input class="form-control form-control-sm me-2" type="search" placeholder="Search">
                <button class="btn btn-outline-light btn-sm" type="submit"><i class="bi bi-search"></i></button>
                </form>
                <a href="#" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-in-right me-1"></i> Login</a>
            </div>
            </div>
        </nav>
        </header>


        <!-- Bootstrap JS -->
        <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
        ></script>
    </body>
    </html>
