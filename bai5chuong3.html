<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
            <div class="container">
            <form action="" class="was-validated">
                <h2 style="text-align: center;">Nhập dữ liệu thông tin</h2>
                <div class="row1">
                    <label for="uname" class="form-label">Tên đăng nhập:</label>
                    <input
                        type="text"
                        class="form-control"
                        id="uname"
                        placeholder="Nhập tên đăng nhập"
                        name="uname"
                        required
                        maxlength="10"
                    />
                    <div class="valid-feedback">Hợp lệ.</div>
                    <div class="invalid-feedback">Vui lòng điền tên đăng nhập.</div>
                </div>
                <div class="row2">
                    <label for="pwd" class="form-label">Mật khẩu:</label>
                    <input
                        type="password"
                        class="form-control"
                        id="pwd"
                        placeholder="Nhập mật khẩu"
                        name="pswd"
                        required
                    />
                    <div class="valid-feedback">Hợp lệ.</div>
                    <div class="invalid-feedback">Vui lòng điền mật khẩu.</div>
                </div>
                <div class=" m-5 form-check">
                    <label class="form-check-label">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            name="remember"
                            required
                        /> Tôi đồng ý với các điều khoản.
                    </label>
                    <div class="valid-feedback">Hợp lệ.</div>
                    <div class="invalid-feedback">0
                        Bạn phải đồng ý với các điều khoản.
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Đăng nhập</button>
            </div>
        </main>
        <footer>
            <div class="container" style="max-width: 600px;">
                <h3 class="mb-4">Registration Form</h3>
                    
                <form>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="firstName" class="form-label">First Name:</label>
                            <input type="text" class="form-control" id="firstName" placeholder="First Name">
                        </div>
                        <div class="col">
                            <label for="lastName" class="form-label">Last Name:</label>
                            <input type="text" class="form-control" id="lastName" placeholder="Last Name">
                        </div>
                    </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address:</label>
                            <input type="email" class="form-control" id="email" placeholder="Email Address">
                        </div>
                        <div class="mb-3">
                            <label for="mobile" class="form-label">Mobile Number:</label>
                            <input type="tel" class="form-control" id="mobile" placeholder="Phone Number">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Date of Birth:</label>
                            <div class="row">
                                <div class="col">
                                    <select class="form-select">
                                        <option selected disabled>Date</option>
                                        <script>
                                            for(let i=1; i<=31; i++) {
                                                document.write(`<option value="${i}">${i}</option>`);
                                            }
                                        </script>
                                    </select>
                                </div>
                                <div class="col">
                                    <select class="form-select">
                                        <option selected disabled>Month</option>
                                        <script>
                                            for(let i=1; i<=12; i++) {
                                                document.write(`<option value="${i}">Tháng ${i}</option>`);
                                            }
                                        </script>
                                    </select>
                                </div>
                                <div class="col">
                                    <select class="form-select">
                                        <option selected disabled>Year</option>
                                        <script>
                                            for(let i=2026; i>=1970; i--) {
                                                document.write(`<option value="${i}">${i}</option>`);
                                            }
                                        </script>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="address" class="form-label">Postal Address:</label>
                            <textarea class="form-control" id="address" rows="3" placeholder="Postal Address"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="zipCode" class="form-label">Zip Code:</label>
                            <input type="text" class="form-control" id="zipCode" placeholder="Zip Code">
                        </div>
                        <div class="mb-3">
                            <label for="formFile" class="form-label">Upload Image:</label>
                            <input class="form-control" type="file" id="formFile">
                        </div>
                        <div class="mb-3">
                            <label class="form-label d-block">Gender:</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="male" value="male">
                                <label class="form-check-label" for="male">Male</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                                <label class="form-check-label" for="female">Female</label>
                            </div>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="terms">
                            <label class="form-check-label" for="terms">I agree to the Terms and Conditions</label>
                        </div>
                        <button type="submit" class="btn btn-secondary">Submit</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                    </form>
                </div>
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
