<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bootstrap Container</title>

        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>

        <main class="py-4">

            <!-- Container SM -->
            <div class="container-sm mb-4">
                <div class="bg-primary text-white p-4 text-center">
                    <h3>Container SM</h3>
                    <p class="mb-0">
                        Khối nội dung sử dụng class .container-sm
                    </p>
                </div>
            </div>


            <!-- Container MD -->
            <div class="container-md mb-4">
                <div class="bg-success text-white p-4 text-center">
                    <h3>Container MD</h3>
                    <p class="mb-0">
                        Khối nội dung sử dụng class .container-md
                    </p>
                </div>
            </div>


            <!-- Container LG -->
            <div class="container-lg mb-4">
                <div class="bg-warning text-dark p-4 text-center">
                    <h3>Container LG</h3>
                    <p class="mb-0">
                        Khối nội dung sử dụng class .container-lg
                    </p>
                </div>
            </div>


            <!-- Container XL -->
            <div class="container-xl mb-4">
                <div class="bg-danger text-white p-4 text-center">
                    <h3>Container XL</h3>
                    <p class="mb-0">
                        Khối nội dung sử dụng class .container-xl
                    </p>
                </div>
            </div>

        </main>

        <footer>
            <!-- place footer here -->
        </footer>


        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>

    </body>
</html>
