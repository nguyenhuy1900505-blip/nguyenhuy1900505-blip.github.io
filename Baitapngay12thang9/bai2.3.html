            <!-- --------------------------------Bài 2.3----------------------------------- -->

            <div class="container mt-4">

                <h2>Bài 2.3: Căn chỉnh hình ảnh</h2>

                <!-- Căn trái -->
                <p>Left alignment (This is default)</p>

                <div class="khung">
                    <img src="images.jpg" class="anh">
                </div>


                <!-- Căn giữa -->
                <p>Center alignment using text alignment classes</p>

                <div class="khung text-center">
                    <img src="images.jpg" class="anh">
                </div>


                <!-- Căn phải -->
                <p>Right alignment using text alignment classes</p>

                <div class="khung text-end">
                    <img src="images.jpg" class="anh">
                </div>


                <!-- Căn trái và phải bằng float -->
                <p>Horizontal alignment using float classes</p>

                <div class="khung clearfix">
                    <img src="images.jpg" class="anh float-start">

                    <img src="images.jpg" class="anh float-end">
                </div>


                <!-- Căn giữa bằng margin auto -->
                <p>Center alignment of block-level image using auto margin</p>

                <div class="khung">
                    <img src="images.jpg" class="anh d-block mx-auto">
                </div>

            </div>
