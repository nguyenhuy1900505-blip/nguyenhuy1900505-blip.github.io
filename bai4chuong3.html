<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <style>
            body {
                padding-top: 20px;
                padding-bottom: 20px;
            }
            .form-check-input {
                margin-right: 0.25rem; /* chỉnh nhỏ lại */
            }
        </style>
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>

            <div class="container" style="max-width: 700px;">
                <h2 style="text-align: center;">Bảng thông tin đăng nhập</h2>
                <div class="row">
                    <div class="col-md-2">
                        <label for="uname" class="form-label" style="margin-top: 10px;">Email</label>
                    </div>
                    <div class="col-md-10">
                        <div class="mb-3">
                            <textarea class="form-control" name="uname" id="uname" rows="1" placeholder="Nhập Email"></textarea>
                        </div>
                        
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-2">
                        <label for="password" class="form-label" style="margin-top: 10px;">Password</label>
                    </div>
                    <div class="col-md-10">
                        <div class="mb-3">
                            <textarea class="form-control" name="password" id="password" rows="1" placeholder="Nhập Password"></textarea>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-2"></div>
                    <div class="col-md-10">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="rememberMe" />
                            <label class="form-check-label" for="rememberMe"> Remember me </label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-2"></div>
                    <div class="col-md-10">
                        <button type="submit" class="btn btn-primary">Sign in</button>
                    </div>
            </div>




            <div class="container" style="max-width: 700px">
                <h2 style="text-align: center;">Textarea</h2>
                <p> Dùng class.form-control để tạo Cho vùng văn bản </p>
                <div class="mb-3">
                    <label for="lem" class="form-label">Bình luận:</label>
                    <textarea class="form-control" name="lem" id="lem" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Gửi</button>
            </div>



        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
