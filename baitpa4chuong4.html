<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
            <div class="container mt-4">
                <ul class="nav nav-tabs" id="myTab" role="tablist">
                    <li class="nav-item" role="presentation">
                    <button
                        class="nav-link active"
                        id="home-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#home"
                        type="button"
                        role="tab"
                        aria-controls="home"
                        aria-selected="true"
                    >
                        Trang chủ
                    </button>
                    </li>
                    <li class="nav-item" role="presentation">
                    <button
                        class="nav-link"
                        id="business-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#business"
                        type="button"
                        role="tab"
                        aria-controls="business"
                        aria-selected="false"
                    >
                        Kinh doanh
                    </button>
                    </li>
                    <li class="nav-item" role="presentation">
                    <button
                        class="nav-link"
                        id="tech-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#tech"
                        type="button"
                        role="tab"
                        aria-controls="tech"
                        aria-selected="false"
                    >
                        Công nghệ
                    </button>
                    </li>
                    <li class="nav-item" role="presentation">
                    <button
                        class="nav-link"
                        id="finance-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#finance"
                        type="button"
                        role="tab"
                        aria-controls="finance"
                        aria-selected="false"
                    >
                        Tài chính
                    </button>
                    </li>
                </ul>

                <div class="tab-content mt-3" id="myTabContent">
                    <div
                    class="tab-pane fade show active"
                    id="home"
                    role="tabpanel"
                    aria-labelledby="home-tab"
                    ><!-- lệnh trỏ đến aria-labelledby =" id của trang "-->
                    <h4>Trang chủ</h4>
                    <p>Chào mừng bạn đến với trang chủ.</p>
                    </div>
                    <div
                    class="tab-pane fade"
                    id="business"
                    role="tabpanel"
                    aria-labelledby="business-tab"
                    >
                    <h4>Kinh doanh</h4>
                    <p>Nội dung về lĩnh vực kinh doanh.</p>
                    </div>
                    <div
                    class="tab-pane fade"
                    id="tech"
                    role="tabpanel"
                    aria-labelledby="tech-tab"
                    >
                    <h4>Công nghệ</h4>
                    <p>Tin tức và xu hướng công nghệ mới nhất.</p>
                    </div>
                    <div
                    class="tab-pane fade"
                    id="finance"
                    role="tabpanel"
                    aria-labelledby="finance-tab"
                    >
                    <h4>Tài chính</h4>4
                        Sáng nay 25/4, giá vàng thế giới biến động mạnh. Sau khi rơi xuống
                        rồi đảo chiều tăng mạnh, giá vàng giao ngay tăng gần 2%...
                    </p>
                    </div>
                </div>
                </div>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
